<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digit Classifier</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3d;
      --accent: #7c6af7;
      --accent2: #f76a8c;
      --text: #e8e8f0;
      --muted: #6b6b88;
      --success: #6af7b8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .glow-orb {
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,106,247,0.12) 0%, transparent 70%);
      top: -150px; right: -150px;
      pointer-events: none;
      z-index: 0;
    }
    .glow-orb2 {
      position: fixed;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(247,106,140,0.08) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown 0.6s ease both;
    }

    .badge {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 100px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 400;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      animation: fadeUp 0.6s ease 0.15s both;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
      position: relative;
    }

    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(124,106,247,0.05);
      transform: scale(1.01);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 0.75rem;
      display: block;
      filter: grayscale(0.3);
    }

    .upload-label {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .upload-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.3rem;
      font-family: 'Space Mono', monospace;
    }

    /* Preview */
    .preview-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .preview-wrap.show { display: flex; }

    .preview-img-box {
      width: 120px; height: 120px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #000;
      display: flex; align-items: center; justify-content: center;
    }

    .preview-img-box img {
      width: 100%; height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .preview-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .btn-clear {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 0.35rem 0.9rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-clear:hover { border-color: var(--accent2); color: var(--accent2); }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    /* API config */
    .api-row {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .api-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .api-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.55rem 0.85rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .api-input::placeholder { color: var(--muted); }
    .api-input:focus { border-color: var(--accent); }

    /* Submit button */
    .btn-predict {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn-predict:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
    .btn-predict:active:not(:disabled) { transform: translateY(0); }
    .btn-predict:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-predict .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn-predict.loading .btn-text { display: none; }
    .btn-predict.loading .spinner { display: block; }

    /* Result */
    .result-box {
      margin-top: 1.5rem;
      border-radius: 14px;
      padding: 1.5rem;
      display: none;
      animation: fadeUp 0.4s ease both;
    }

    .result-box.show { display: block; }

    .result-box.success {
      background: rgba(106,247,184,0.06);
      border: 1px solid rgba(106,247,184,0.25);
    }

    .result-box.error {
      background: rgba(247,106,140,0.06);
      border: 1px solid rgba(247,106,140,0.3);
    }

    .result-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .result-box.success .result-label { color: var(--success); }
    .result-box.error .result-label { color: var(--accent2); }

    .result-digit {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--success), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result-confidence {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .confidence-bar-wrap {
      margin-top: 0.9rem;
      height: 6px;
      background: var(--surface2);
      border-radius: 100px;
      overflow: hidden;
    }

    .confidence-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      border-radius: 100px;
      transition: width 0.6s ease;
      width: 0%;
    }

    .result-error-msg {
      font-size: 0.88rem;
      color: var(--accent2);
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      opacity: 0.6;
      animation: fadeUp 0.6s ease 0.3s both;
    }
  </style>
</head>
<body>

<div class="glow-orb"></div>
<div class="glow-orb2"></div>

<div class="container">
  <header>
    <div class="badge">✦ Neural Network</div>
    <h1>Digit<br><span>Classifier</span></h1>
    <p class="subtitle">Upload a handwritten digit image — get an instant prediction.</p>
  </header>

  <div class="card">

    <!-- API URL (hardcoded) -->
    <div class="api-row">
      <span class="api-label">Endpoint</span>
      <span class="api-input" id="apiUrl" style="display:flex;align-items:center;gap:0.4rem;cursor:default;">
        <span style="color:var(--success);font-size:0.65rem;">●</span>
        backend-mm-digit-lens.onrender.com/predict
      </span>
    </div>

    <!-- Upload zone -->
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" />
      <span class="upload-icon">🖼️</span>
      <div class="upload-label">Drop image here or click to browse</div>
      <div class="upload-sub">PNG · JPG · GIF · WEBP</div>
    </div>

    <!-- Preview -->
    <div class="preview-wrap" id="previewWrap">
      <div class="preview-img-box">
        <img id="previewImg" src="" alt="Preview" />
      </div>
      <span class="preview-name" id="previewName"></span>
      <button class="btn-clear" id="btnClear">✕ Remove</button>
    </div>

    <div class="divider"></div>

    <!-- Predict button -->
    <button class="btn-predict" id="btnPredict" disabled>
      <span class="btn-text">Identify Digit</span>
      <div class="spinner"></div>
    </button>

    <!-- Result -->
    <div class="result-box" id="resultBox">
      <div class="result-label" id="resultLabel"></div>
      <div class="result-digit" id="resultDigit"></div>
      <div class="result-confidence" id="resultConfidence"></div>
      <div class="confidence-bar-wrap" id="confBarWrap" style="display:none">
        <div class="confidence-bar" id="confBar"></div>
      </div>
      <div class="result-error-msg" id="resultErrorMsg"></div>
    </div>

  </div>

  <footer>Digit Classifier · Handwritten digit recognition</footer>
</div>

<script>
  const fileInput   = document.getElementById('fileInput');
  const uploadZone  = document.getElementById('uploadZone');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg  = document.getElementById('previewImg');
  const previewName = document.getElementById('previewName');
  const btnClear    = document.getElementById('btnClear');
  const btnPredict  = document.getElementById('btnPredict');
  const resultBox   = document.getElementById('resultBox');
  const resultLabel = document.getElementById('resultLabel');
  const resultDigit = document.getElementById('resultDigit');
  const resultConf  = document.getElementById('resultConfidence');
  const confBarWrap = document.getElementById('confBarWrap');
  const confBar     = document.getElementById('confBar');
  const resultErrMsg= document.getElementById('resultErrorMsg');

  let selectedFile = null;

  // Drag & drop
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) setFile(f);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      previewName.textContent = file.name;
      previewWrap.classList.add('show');
      btnPredict.disabled = false;
      hideResult();
    };
    reader.readAsDataURL(file);
  }

  btnClear.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    previewWrap.classList.remove('show');
    btnPredict.disabled = true;
    hideResult();
  });

  function hideResult() {
    resultBox.className = 'result-box';
    resultDigit.textContent = '';
    resultConf.textContent = '';
    resultErrMsg.textContent = '';
    confBarWrap.style.display = 'none';
    confBar.style.width = '0%';
  }

  btnPredict.addEventListener('click', async () => {
    if (!selectedFile) return;

    const base = 'https://backend-mm-digit-lens.onrender.com';

    setLoading(true);
    hideResult();

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch(`${base}/predict`, {
        method: 'POST',
        body: formData,
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`Server error ${res.status}: ${errText}`);
      }

      const data = await res.json();

      // Support common response shapes:
      // { prediction: 7, confidence: 0.98 }
      // { digit: 7, probability: 0.98 }
      // { class: 7, score: 0.98 }
      // { label: "7" }
      const digit =
        data.prediction ?? data.digit ?? data.class ?? data.label ?? data.result ?? '?';
      const confidence =
        data.confidence ?? data.probability ?? data.score ?? null;

      showSuccess(digit, confidence);

    } catch (err) {
      showError(err.message || 'Something went wrong. Check the API URL and try again.');
    } finally {
      setLoading(false);
    }
  });

  function setLoading(on) {
    btnPredict.disabled = on;
    btnPredict.classList.toggle('loading', on);
  }

  function showSuccess(digit, confidence) {
    resultBox.className = 'result-box success show';
    resultLabel.textContent = '✦ Predicted Digit';
    resultDigit.textContent = digit;
    resultErrMsg.textContent = '';

    if (confidence !== null && !isNaN(confidence)) {
      const pct = Math.round(confidence * 100);
      resultConf.textContent = `Confidence: ${pct}%`;
      confBarWrap.style.display = 'block';
      setTimeout(() => confBar.style.width = pct + '%', 50);
    } else {
      resultConf.textContent = '';
      confBarWrap.style.display = 'none';
    }
  }

  function showError(msg) {
    resultBox.className = 'result-box error show';
    resultLabel.textContent = '⚠ Error';
    resultDigit.textContent = '';
    resultConf.textContent = '';
    confBarWrap.style.display = 'none';
    resultErrMsg.textContent = msg;
  }
</script>
</body>
</html>
